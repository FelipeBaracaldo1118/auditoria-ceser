{% extends "base.html" %}{% block titulo %}Entrar · Auditoría CESER{% endblock %}
{% block cuerpo %}
<div class="entrada">
  <h1>Auditoría CESER</h1>
  <p class="sub">Revisión de órdenes de repuestos contra las aseguradoras.</p>
  <form method="post" action="{{ url_for('entrar_post') }}{% if request.args.siguiente %}?siguiente={{ request.args.siguiente }}{% endif %}">
    {% for m in get_flashed_messages() %}<div class="aviso">{{ m }}</div>{% endfor %}
    <label>Usuario<br><input name="usuario" autocomplete="username" autofocus required style="width:100%"></label>
    <label>Contraseña<br>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required style="width:100%">
    </label>
    <label class="ver-clave">
      <input type="checkbox" id="ver" onchange="document.getElementById('clave').type = this.checked ? 'text' : 'password'">
      Mostrar la contraseña
    </label>
    <button class="principal" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
